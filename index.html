<!doctype html>
<html lang="pt-BR" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MY Brechó - Controle de Vendas & Lucro</title>
    <meta name="description" content="Aplicativo de controle de vendas diárias e lucro do MY Brechó." />
    <meta property="og:title" content="MY Brechó - Controle de Vendas & Lucro" />
    <meta property="og:description" content="Aplicativo de controle de vendas diárias e lucro do MY Brechó." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MY Brechó" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root" class="h-full">
      <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#34d399;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:42px;height:42px;border:4px solid rgba(16,185,129,0.2);border-top-color:#34d399;border-radius:9999px;animation:spin 0.9s linear infinite;"></div>
        <p style="margin-top:14px;font-size:13px;font-weight:700;color:#cbd5e1;">Abrindo MY Brechó...</p>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        window.__APP_MOUNTED__ = false;
        var RECOVER_KEY = 'mybrecho_sw_recover_ts';

        window.__RECOVER_APP__ = function (forceManual) {
          try {
            var now = Date.now();
            var last = Number(sessionStorage.getItem(RECOVER_KEY) || '0');
            if (!forceManual && now - last < 15000) {
              showBootFallback();
              return;
            }
            sessionStorage.setItem(RECOVER_KEY, String(now));
          } catch (e) {}

          var finishReload = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set('v', String(Date.now()));
              window.location.replace(u.toString());
            } catch (e) {
              window.location.reload();
            }
          };

          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
                })
              );
            }
            if ('caches' in window) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () {}); }));
                })
              );
            }
          } catch (e) {}

          Promise.all(jobs).then(finishReload, finishReload);
        };

        function showBootFallback() {
          var root = document.getElementById('root');
          if (!root || window.__APP_MOUNTED__) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;padding:20px;">' +
              '<div style="max-width:340px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.6);">' +
                '<div style="width:48px;height:48px;margin:0 auto 12px;border-radius:16px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.35);display:flex;align-items:center;justify-content:center;color:#34d399;font-weight:900;font-size:20px;">!</div>' +
                '<h2 style="margin:0 0 8px;font-size:16px;font-weight:800;color:#fff;">Atualizando o Aplicativo</h2>' +
                '<p style="margin:0 0 18px;font-size:12px;line-height:1.5;color:#94a3b8;">Detectamos uma versão antiga em cache. Toque abaixo para abrir a versão mais recente com segurança.</p>' +
                '<button onclick="window.__RECOVER_APP__(true)" style="width:100%;padding:12px 16px;border:none;border-radius:14px;background:#10b981;color:#020617;font-size:13px;font-weight:800;cursor:pointer;">Atualizar e Abrir App</button>' +
              '</div>' +
            '</div>';
        }

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            if (!window.__APP_MOUNTED__) {
              window.__RECOVER_APP__(false);
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var msg = event && event.reason ? String(event.reason.message || event.reason) : '';
          if (
            !window.__APP_MOUNTED__ &&
            (msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
             msg.indexOf('Importing a module script failed') !== -1 ||
             msg.indexOf('Loading chunk') !== -1)
          ) {
            window.__RECOVER_APP__(false);
          }
        });

        setTimeout(function () {
          if (!window.__APP_MOUNTED__) {
            showBootFallback();
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
