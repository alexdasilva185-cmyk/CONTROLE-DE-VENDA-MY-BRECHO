<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner circle glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Center Card / Icon -->
  <g filter="url(#shadow)">
    <!-- Shopping bag / register icon base -->
    <rect x="120" y="180" width="272" height="230" rx="36" fill="#0f172a" />
    
    <!-- Bag Handle -->
    <path d="M192 180 V140 C192 104 220 76 256 76 C292 76 320 104 320 140 V180" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" />
    
    <!-- Upward Trend Arrow -->
    <path d="M164 340 L220 280 L268 316 L348 228" fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M304 228 H348 V272" fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Currency Symbol R$ Badge -->
    <circle cx="256" cy="235" r="42" fill="url(#accentGrad)" />
    <text x="256" y="248" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#064e3b" text-anchor="middle">$</text>
  </g>
</svg>
